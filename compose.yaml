# Production stack (plan §6). Copy .env.example to .env first.
#   docker compose up -d --build
# Backups run from the host (scripts/backup.sh via cron/systemd), not from Django-Q2.
x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  volumes:
    - media:/app/media
  restart: unless-stopped

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # postgres:18 keeps PGDATA under /var/lib/postgresql/18/docker; mount the parent.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    <<: *app
    command: >
      sh -c "python manage.py migrate --noinput
             && python manage.py createcachetable
             && python manage.py seed_catalog
             && python manage.py seed_inventory
             && python manage.py setup_schedules
             && exec gunicorn labstock.wsgi --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    <<: *app
    command: python manage.py qcluster
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2.10
    ports:
      - "80:80"
      - "443:443"
    environment:
      LABSTOCK_DOMAIN: ${LABSTOCK_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
