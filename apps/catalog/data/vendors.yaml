# Vendor families and the names people type for them into Quartzy.
#
# A family is the unit the duplicate guard compares catalog numbers within. Brands that
# sell under the same catalog numbers share a family (Gibco, Invitrogen and Life
# Technologies under Thermo Fisher; Sigma-Aldrich and Millipore under Merck KGaA).
# Distributors sell other brands under their own SKUs, so each distributor is its own
# family with distributor: true, and its own brands (Fisherbrand, J.T.Baker) sit with it.
#
# Aliases are compared after apps.catalog.normalization.normalize_vendor_name (casefold,
# punctuation, "&" -> "and", a leading "the", trailing Inc./LLC/GmbH...) and again with
# the spaces removed, so "Bio-Rad", "Bio Rad" and "BioRad" are one alias. Every vendor
# name is also an alias of itself. Names that combine aliases of one family ("Thermo
# Fisher (Gibco)", "Corning Costar") resolve without being listed; names that mix a
# distributor and a brand ("Fisher Scientific (Thermo)") deliberately don't.
# Ambiguous on purpose and left out: "Jackson" (JAX or Jackson ImmunoResearch), "Fluka"
# (Sigma-Aldrich or Honeywell), "Pyrex" (Corning in the US, DWK in Europe).
#
# catalog_rule names a pack rule in apps.catalog.vendor_rules.RULES (for ATCC, a rule that
# keeps the dot between digits).
families:
  - slug: thermo
    name: Thermo Fisher Scientific
    distributor: false
    catalog_rule: thermo
    vendors:
      - name: Thermo Fisher Scientific
        aliases: [thermo, Thermo Fisher, ThermoFisher, Thermo-Fisher, ThermoFisher Scientific,
                  "Thermo Fisher Scientific, Inc.", Thermo Fisher Sci, TFS, thermofisher.com,
                  Thermo Electron]
      - name: Thermo Scientific
        aliases: [Thermo Sci, Thermo Scientific Inc.]
      - name: Gibco
        aliases: [GIBCO BRL, Gibco by Life Technologies, Gibco by Thermo Fisher Scientific,
                  Gibco Invitrogen, Bethesda Research Laboratories]
      - name: Invitrogen
        aliases: [Invitrogen by Thermo Fisher Scientific, Invitrogen Life Technologies,
                  Invitrogen Corporation]
      - name: Life Technologies
        aliases: [Life Tech, LifeTech, Life Technologies Corporation]
      - name: Applied Biosystems
        aliases: [ABI, Applied Biosystems by Thermo Fisher Scientific, Applied Biosystem]
      - name: Ambion
        aliases: [Ambion by Life Technologies]
      - name: Pierce
        aliases: [Pierce Biotechnology, Pierce Chemical, Thermo Scientific Pierce]
      - name: Molecular Probes
        aliases: [Molecular Probes by Life Technologies, Invitrogen Molecular Probes]
